<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

<title>MedAI Doctor Dashboard</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
/>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  display:flex;
  background:#f5f7fb;
  min-height:100vh;
}

/* SIDEBAR */

.sidebar{
  width:270px;
  background:#081b4b;
  color:white;
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:40px;
}

.logo img{
  width:55px;
  height:55px;
  border-radius:12px;
}

.logo h2{
  font-size:30px;
}

.menu{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu a{
  text-decoration:none;
  color:white;
  padding:14px 18px;
  border-radius:14px;
  transition:0.3s;
  font-size:16px;
}

.menu a:hover,
.menu .active{
  background:linear-gradient(
    135deg,
    #5d5fef,
    #7b61ff
  );
}

.new-appointment{
  background:#102868;
  padding:20px;
  border-radius:22px;
  margin-top:30px;
}

.new-appointment h3{
  margin-bottom:10px;
}

.new-appointment button{
  margin-top:15px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:#5d5fef;
  color:white;
  font-weight:600;
  cursor:pointer;
}

/* MAIN */

.main{
  flex:1;
  padding:30px;
}

/* TOPBAR */

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:30px;
}

.search{
  background:white;
  width:400px;
  padding:14px 20px;
  border-radius:16px;
}

.search input{
  border:none;
  outline:none;
  width:100%;
  font-size:15px;
}

.profile{
  display:flex;
  align-items:center;
  gap:15px;
}

.profile img{
  width:55px;
  height:55px;
  border-radius:50%;
}

/* CARDS */

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:20px;
  margin-bottom:30px;
}

.card{
  background:white;
  padding:25px;
  border-radius:24px;
  box-shadow:0 5px 20px rgba(0,0,0,0.04);
}

.card h4{
  color:#666;
  margin-bottom:12px;
}

.card h2{
  font-size:36px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:25px;
}

/* TABLE */

.table-box{
  background:white;
  border-radius:24px;
  padding:25px;
}

.table-box h2{
  margin-bottom:20px;
}

table{
  width:100%;
  border-collapse:collapse;
}

table th,
table td{
  padding:15px;
  text-align:left;
  border-bottom:1px solid #eee;
}

.status{
  padding:7px 12px;
  border-radius:20px;
  font-size:13px;
  font-weight:600;
}

.upcoming{
  background:#dbeafe;
  color:#2563eb;
}

.completed{
  background:#dcfce7;
  color:#16a34a;
}

/* RIGHT PANEL */

.right-panel{
  display:flex;
  flex-direction:column;
  gap:25px;
}

.panel{
  background:white;
  border-radius:24px;
  padding:25px;
}

.notification{
  padding:15px 0;
  border-bottom:1px solid #eee;
}

.notification:last-child{
  border:none;
}

.notification p{
  color:#666;
  margin-top:5px;
}

/* CHART */

.chart{
  height:250px;
  display:flex;
  align-items:flex-end;
  gap:15px;
  margin-top:20px;
}

.bar{
  width:40px;
  background:#5d5fef;
  border-radius:12px 12px 0 0;
}

/* RESPONSIVE */

@media(max-width:1200px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

}

@media(max-width:900px){

  body{
    flex-direction:column;
  }

  .sidebar{
    width:100%;
  }

  .grid{
    grid-template-columns:1fr;
  }

}

@media(max-width:600px){

  .cards{
    grid-template-columns:1fr;
  }

  .topbar{
    flex-direction:column;
    gap:20px;
    align-items:flex-start;
  }

  .search{
    width:100%;
  }

}

</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

  <div>

    <div class="logo">

      <img src="a2.1.png">

      <h2>MedAI</h2>

    </div>

    <div class="menu">

      <a href="#" class="active">
        🏠 Dashboard
      </a>

      <a href="#">
        👨‍⚕ Patients
      </a>

      <a href="#">
        📅 Appointments
      </a>

      <a href="#">
        🩺 Consultations
      </a>

      <a href="#">
        📋 Reports
      </a>

      <a href="#">
        🤖 AI Insights
      </a>

      <a href="#">
        💬 Messages
      </a>

      <a href="#">
        ⚙ Settings
      </a>

    </div>

  </div>

  <div class="new-appointment">

    <h3>Medicine Reminder</h3>

    <p>
      Enable notifications and test reminder
    </p>

    <button onclick="enableNotifications()">
      Enable Notifications
    </button>

    <button onclick="setMedicineReminder()">
      Set Medicine Reminder
    </button>

  </div>

</div>

<!-- MAIN -->

<div class="main">

  <div class="topbar">

    <div>

      <h1>
        Welcome back Doctor 👋
      </h1>

      <p>
        Here's your clinic overview
      </p>

    </div>

    <div class="profile">

      <div class="search">

        <input
          type="text"
          placeholder="Search patients..."
        >

      </div>

      <img src="https://i.pravatar.cc/150?img=12">

    </div>

  </div>

  <div class="cards">

    <div class="card">

      <h4>Total Patients</h4>

      <h2>256</h2>

    </div>

    <div class="card">

      <h4>Appointments</h4>

      <h2>18</h2>

    </div>

    <div class="card">

      <h4>Reports Pending</h4>

      <h2>24</h2>

    </div>

    <div class="card">

      <h4>AI Alerts</h4>

      <h2>7</h2>

    </div>

  </div>

</div>

<script>

async function enableNotifications(){

   const permission =
   await Notification.requestPermission();

   if(permission === "granted"){

      alert("Notifications Enabled ✅");

   } else {

      alert("Permission Denied");

   }

}

function sendMedicineNotification(){

   new Notification(
      "💊 Medicine Reminder",
      {
         body:
         "Time to take your medicine"
      }
   );

}

function setMedicineReminder(){

   alert("Medicine Reminder Set For 1 Minute ✅");

   setTimeout(() => {

      sendMedicineNotification();

   }, 60000);

}

</script>

</body>
</html>
