<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Health Care Form</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, sans-serif;
    }

    body{
    background-image: url("a1.PNG");
    background-size: cover;
    background-repeat: no-repeat;
    background-attachment: fixed;
      display:flex;
      justify-content:center;
      padding:20px;
    }

    .container{
      width:100%;
      max-width:430px;
      background:white;
      border-radius:25px;
      padding:25px;
      box-shadow:0 5px 20px rgba(0,0,0,0.1);
    }

    .top{
      text-align:center;
      margin-bottom:25px;
    }

    .logo{
      width:90px;
      height:90px;
      border-radius:50%;
      object-fit:cover;
      margin-bottom:10px;
      border:4px solid #1565ff;
    }

    h1{
      color:#1565ff;
      font-size:34px;
      margin-bottom:5px;
    }

    .subtitle{
      color:#444;
      font-size:15px;
    }

    .hindi{
      color:#1565ff;
      font-size:18px;
      margin-top:5px;
      font-weight:bold;
    }

    .card{
      margin-top:20px;
    }

    .field{
      margin-bottom:18px;
    }

    label{
      display:block;
      font-size:18px;
      margin-bottom:8px;
      color:#0d2f66;
      font-weight:bold;
    }

    input, select{
      width:100%;
      padding:15px;
      border:2px solid #d9e5ff;
      border-radius:15px;
      font-size:16px;
      outline:none;
      background:#f8fbff;
    }

    input:focus, select:focus{
      border-color:#1565ff;
    }

    .btn{
      width:100%;
      padding:16px;
      border:none;
      border-radius:16px;
      background:#1565ff;
      color:white;
      font-size:20px;
      font-weight:bold;
      cursor:pointer;
      margin-top:10px;
      transition:0.3s;
    }

    .btn:hover{
      background:#0d47d9;
    }

    .safe{
      text-align:center;
      margin-top:18px;
      color:#1565ff;
      font-size:15px;
      font-weight:bold;
    }

    @media(max-width:480px){
      h1{
        font-size:28px;
      }

      label{
        font-size:16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- FORM START -->
    <form id="signin">

      <div class="top">

        <!-- YOUR LOGO -->
        <img src="a2.1.png" class="logo">

        <h1>Health Care</h1>

        <div class="subtitle">
          Take Care, Stay Healthy
        </div>

        <div class="hindi">
          स्वस्थ रहें, खुश रहें
        </div>

      </div>

      <div class="card">

        <!-- NAME -->

        <div class="field">
          <label>Name (नाम)</label>

          <input
            type="text"
            id="name"
            placeholder="Enter your full name"
            required
          >
        </div>


        <!-- EMAIL -->

        <div class="field">
          <label>Email</label>

          <input
            type="email"
            id="emailid"
            placeholder="Enter your email"
            required
          >
        </div>


        <!-- PASSWORD -->

        <div class="field">
          <label>Password</label>

          <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
          >
        </div>


        <!-- PHONE -->

        <div class="field">
          <label>Phone Number</label>

          <input
            type="text"
            id="phone"
            placeholder="Enter phone number"
            required
          >
        </div>


        <!-- DOB -->

        <div class="field">
          <label>Date Of Birth</label>

          <input
            type="date"
            id="dob"
            required
          >
        </div>


        <!-- AGE -->

        <div class="field">
          <label>Age (आयु)</label>

          <input
            type="number"
            id="age"
            placeholder="Enter your age"
            required
          >
        </div>


        <!-- BLOOD GROUP -->

        <div class="field">

          <label>Blood Group (ब्लड ग्रुप)</label>

          <select id="bloodgroup" required>

            <option value="">
              Select Blood Group
            </option>

            <option>A+</option>
            <option>A-</option>
            <option>B+</option>
            <option>B-</option>
            <option>AB+</option>
            <option>AB-</option>
            <option>O+</option>
            <option>O-</option>

          </select>

        </div>


        <!-- WEIGHT -->

        <div class="field">

          <label>Weight (वजन)</label>

          <input
            type="number"
            id="weight"
            placeholder="Enter your weight"
            required
          >

        </div>


        <!-- BLOOD SUGAR -->

        <div class="field">

          <label>Blood Sugar (ब्लड शुगर)</label>

          <input
            type="number"
            id="sugar"
            placeholder="Enter blood sugar"
            required
          >

        </div>


        <!-- BLOOD PRESSURE -->

        <div class="field">

          <label>Blood Pressure (ब्लड प्रेशर)</label>

          <input
            type="text"
            id="pressure"
            placeholder="120/80"
            required
          >

        </div>


        <!-- HEART RATE -->

        <div class="field">

          <label>Heart Rate (हार्ट रेट)</label>

          <input
            type="number"
            id="heartrate"
            placeholder="Heart Rate"
            required
          >

        </div>


        <!-- SUBMIT BUTTON -->

        <button class="btn" type="submit">
          Save & Continue
        </button>


        <!-- SAFE TEXT -->

        <div class="safe">
          🔒 Your information is secure with us
        </div>

      </div>

    </form>
    <!-- FORM END -->

  </div>


  <!-- JS FILE -->

  <script
    type="module"
    src="signin.js"
  ></script>

</body>
</html>
