<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Blood</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    .top-bar {
      background: linear-gradient(90deg, #c9182b, #ef233c, #ff6b81);
      color: #fff;
      padding: 20px 60px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-bar h2 {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-bar span {
      opacity: .85;
    }

    .hero {
      background: linear-gradient(90deg, #e63946, #ff758f);
      padding: 40px 60px;
      color: #fff;
    }

    .hero-content {
      display: flex;
      align-items: center;
      gap: 40px;
    }

    .hero img {
      width: 120px;
    }

    .hero h1 {
      font-size: 36px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 16px;
      opacity: .9;
    }

    .page {
      background: #f6f6f9;
      padding: 40px 60px;
    }

    .grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, .1);
    }

    .card h3 {
      margin-bottom: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    .row.full {
      grid-template-columns: 1fr;
    }

    input,
    select {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 14px;
    }

    .urgency {
      display: flex;
      gap: 25px;
      margin-top: 10px;
    }

    .urgency label {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .emergency {
      color: #c9182b;
      font-weight: 600;
    }

    button {
      margin-top: 25px;
      padding: 14px;
      width: 220px;
      background: linear-gradient(90deg, #c9182b, #ef233c);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }

    .info {
      background: #ffe5ea;
      border-radius: 16px;
      padding: 25px;
    }

    .info h3 {
      color: #c9182b;
      margin-bottom: 15px;
    }

    .info li {
      list-style: none;
      margin-bottom: 12px;
    }

    .info li::before {
      content: "✔";
      color: #c9182b;
      margin-right: 8px;
    }

    @media(max-width:900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .hero-content {
        flex-direction: column;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar">
    <h2>🩸 Request Blood</h2>
  </div>

  <div class="hero">
    <div class="hero-content">
      <img src="https://cdn-icons-png.flaticon.com/512/2966/2966487.png">
      <div>
        <h1>Request Blood</h1>
        <p>Please fill the form carefully.<br>Emergency requests are prioritised.</p>
      </div>
    </div>
  </div>

  <div class="page">
    <div class="grid">

      <div class="card">
        <h3>Blood Donation Request</h3>

        <form id="requestForm">

          <div class="row">
            <input type="text" id="patientName" placeholder="Patient Name" required>

            <select id="bloodGroup" required>
              <option value="">Select Blood Group</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>

          <div class="row">
            <input type="text" id="hospital" placeholder="Hospital Name" required>

            <input type="text" id="location" placeholder="Location" required>
          </div>

          <div class="row">
            <input type="date" id="date" required>

            <input type="number" id="units" placeholder="Units Required" min="1" required>
          </div>

          <div class="row full">
            <input type="tel" id="contact" placeholder="Contact Number" required>
          </div>

          <div class="urgency">
            <label>
              <input type="radio" name="urgency" value="Normal" checked>
              Normal
            </label>

            <label class="emergency">
              <input type="radio" name="urgency" value="Emergency">
              Emergency
            </label>
          </div>

          <button type="submit">Request Blood</button>

        </form>
      </div>

      <div class="info">
        <h3>Important Information</h3>
        <ul>
          <li>Ensure contact details are correct</li>
          <li>Compatible donors contacted ASAP</li>
          <li>Provide accurate hospital location</li>
        </ul>
      </div>

    </div>
  </div>
  <script type="module" src="request.js"></script>

</body>

</html>
